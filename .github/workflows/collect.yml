name: 데이터 수집

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다 (UTC 기준, 한국시간 02·08·14·20시 17분)
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      backfill:
        description: "최근 6개월 뉴스 채우기 (최초 1회)"
        type: boolean
        default: false
  push:                       # 수집기·은행 목록을 고쳐 올리면 바로 한 번 실행
    branches: [main]
    paths:
      - "collector/**"
      - "banks.json"
      - "topics.json"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 기다리는 사이 다른 수집이 데이터를 올렸을 수 있으니, 실행 시점의 최신 main에서 시작
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collector/collect.py ${{ inputs.backfill && '--backfill' || '' }}
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 수집"
          # 수집하는 동안 main에 다른 커밋이 올라왔으면 그 위에 얹어서 올린다
          # 그래도 겹치면 방금 수집한 데이터(내 커밋)를 우선한다. 리베이스에서 -X theirs = 다시 얹는 내 커밋 쪽
          git pull --rebase -X theirs origin main
          git push
