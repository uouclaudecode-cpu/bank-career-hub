name: 데이터 수집

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다 (UTC 기준, 한국시간 02·08·14·20시 17분)
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      backfill:
        description: "최근 6개월 뉴스 채우기 (최초 1회)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python collector/collect.py ${{ inputs.backfill && '--backfill' || '' }}
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 수집"
          git push
